name: Build Bahar Birthday APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o BaharBirthdayApp_CloudBuild_Ready.zip -d extracted
          find extracted -maxdepth 4 -type f | head -80

      - name: Build APK
        run: |
          PROJECT_DIR="$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle Android project not found in ZIP"
            exit 1
          fi
          cd "$(dirname "$PROJECT_DIR")"
          gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BaharBirthday-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
