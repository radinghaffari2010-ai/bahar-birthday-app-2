name: Build Bahar Birthday APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o BaharBirthdayApp_CloudBuild_Ready.zip -d extracted

      - name: Apply custom icon
        run: |
          python3 -m pip install Pillow
          python3 -c '
          from PIL import Image
          from pathlib import Path

          source = Path("56a85b74e054be42bd72552ec72e7ca4.jpg")
          if not source.is_file():
              raise SystemExit("ERROR: Icon image not found")

          icon = Image.open(source).convert("RGB")
          res_dirs = list(Path("extracted").glob("**/app/src/main/res"))

          if not res_dirs:
              raise SystemExit("ERROR: Android res folder not found")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for res in res_dirs:
              for density, size in sizes.items():
                  folder = res / ("mipmap-" + density)
                  folder.mkdir(parents=True, exist_ok=True)
                  resized = icon.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(folder / "ic_launcher.png")
                  resized.save(folder / "ic_launcher_round.png")

              adaptive = res / "mipmap-anydpi-v26"
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  file = adaptive / name
                  if file.exists():
                      file.unlink()

          print("Custom icon installed successfully")
          '

      - name: Add Bahar Radio and Newspaper page
        run: |
          ASSETS_DIR=$(find extracted -type d -name assets -print -quit)

          if [ -z "$ASSETS_DIR" ]; then
            ASSETS_DIR="extracted/app/src/main/assets"
            mkdir -p "$ASSETS_DIR"
          fi

          cp bahar.jpg "$ASSETS_DIR/bahar.jpg"

          cat > "$ASSETS_DIR/radio-bahar.html" <<'EOF'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>رادیو و روزنامهٔ بهار</title>
          <style>
            body{margin:0;font-family:Tahoma,sans-serif;background:#120726;color:#fff}
            .wrap{max-width:520px;margin:auto;padding:24px}
            h1{color:#ffd166;text-align:center}
            .card{background:#1e1038;border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 8px 24px #0006}
            img{width:100%;border-radius:16px}
            .news{line-height:2}
            audio{width:100%;margin-top:10px}
            .song{margin-top:14px}
            .date{text-align:center;color:#c9b8ff;margin-top:-6px}
          </style>
          </head>
          <body>
          <div class="wrap">

            <h1>📻 رادیو بهار</h1>
            <div class="card">
              <p>برای بهار عزیز، با عشق 🤍</p>

              <div class="song">
                <b>آهنگ ۱</b><br>
                <audio controls src="SONG_1"></audio>
              </div>

              <div class="song">
                <b>آهنگ ۲</b><br>
                <audio controls src="SONG_2"></audio>
              </div>

              <div class="song">
                <b>آهنگ ۳</b><br>
                <audio controls src="SONG_3"></audio>
              </div>
            </div>

            <h1>📰 روزنامهٔ بهار</h1>
            <div class="card">
              <p class="date">ویژهٔ تولد بهار</p>
              <img src="bahar.jpg" alt="بهار">
              <h2>بهار امروز متولد شد!</h2>
              <div class="news">
                <p>🔹 منابع موثق تأیید کردند: لبخند بهار همچنان رکورد جهانی خود را حفظ کرده است.</p>
                <p>🔹 گزارش‌ها حاکی از آن است که حضور بهار، حال همهٔ اطرافیانش را به‌طرز چشمگیری بهتر می‌کند.</p>
                <p>🔹 پیش‌بینی می‌شود امسال نیز بهترین روزهای بهار، در کنار دوستان و عزیزانش رقم بخورد.</p>
              </div>
              <p style="text-align:center;color:#ffd166">تولدت مبارک بهار 🎂✨</p>
            </div>

          </div>
          </body>
          </html>
          EOF

          echo "Radio and newspaper page added."

      - name: Build APK
        run: |
          PROJECT_FILE=$(find extracted -type f ( -name settings.gradle -o -name settings.gradle.kts ) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          cd "$(dirname "$PROJECT_FILE")"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaharBirthday-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
