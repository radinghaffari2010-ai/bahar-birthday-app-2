name: Build Bahar Birthday APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o BaharBirthdayApp_CloudBuild_Ready.zip -d extracted

      - name: Apply custom icon
        run: |
          python3 -m pip install Pillow
          python3 -c '
          from PIL import Image
          from pathlib import Path

          source = Path("56a85b74e054be42bd72552ec72e7ca4.jpg")
          if not source.is_file():
              raise SystemExit("ERROR: Icon image not found")

          icon = Image.open(source).convert("RGB")
          res_dirs = list(Path("extracted").glob("**/app/src/main/res"))

          if not res_dirs:
              raise SystemExit("ERROR: Android res folder not found")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for res in res_dirs:
              for density, size in sizes.items():
                  folder = res / ("mipmap-" + density)
                  folder.mkdir(parents=True, exist_ok=True)
                  resized = icon.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(folder / "ic_launcher.png")
                  resized.save(folder / "ic_launcher_round.png")

              adaptive = res / "mipmap-anydpi-v26"
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  file = adaptive / name
                  if file.exists():
                      file.unlink()

          print("Custom icon installed successfully")
          '

      - name: Build APK
        run: |
          PROJECT_FILE=$(find extracted -type f ( -name settings.gradle -o -name settings.gradle.kts ) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          cd "$(dirname "$PROJECT_FILE")"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaharBirthday-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
